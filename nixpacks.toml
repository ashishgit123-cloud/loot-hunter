[phases.setup]
nixPkgs = [
    "python3",
    "chromium",
    "nss",
    "nspr",
    "atk",
    "cups",
    "dbus",
    "libdrm",
    "libxcomposite",
    "libxdamage",
    "libxfixes",
    "libxrandr",
    "mesa",
    "pango",
    "alsa-lib"
]

[phases.build]
cmds = [
    "pip install -r requirements.txt",
    "playwright install chromium"
]

[start]
cmd = "python loot_listener.py"

[phases.setup]
aptPkgs = ["libglib2.0-0", "libnss3", "libnspr4", "libatk1.0-0", "libatk-bridge2.0-0", "libcups2", "libdrm2", "libdbus-1-3", "libexpat1", "libfontconfig1", "libgbm1", "libgconf-2-4", "libgdk-pixbuf2.0-0", "libgtk-3-0", "libpango-1.0-0", "libpangocairo-1.0-0", "libx11-6", "libx11-xcb1", "libxcb1", "libxcomposite1", "libxcursor1", "libxdamage1", "libxext1", "libxfixes1", "libxi6", "libxrandr2", "libxrender1", "libxtst6", "xdg-utils"]