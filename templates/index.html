<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Bot Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .counter-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #38bdf8;
        }
        .counter-number {
            font-size: 3rem;
            font-weight: bold;
            color: #4ade80;
        }
        .status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #a7f3d0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔥 Loot Deal Bot</h1>
        <p>Telegram Deal Aggregator & Validator Live Status</p>
        
        <div class="counter-box">
            <div>Deals Scanned</div>
            <div class="counter-number" id="scannedCount">0</div>
        </div>

        <div class="status">🟢 Bot Status: Active & Running</div>
    </div>

    <script>
        // Har 5 seconds mein counter ko automatically update karne ke liye API call
        async function fetchStats() {
            try {
                let response = await fetch('/stats');
                let data = await response.json();
                document.getElementById('scannedCount').innerText = data.deals_scanned;
            } catch (err) {
                console.error("Error fetching stats:", err);
            }
        }

        setInterval(fetchStats, 5000);
        fetchStats(); // Initial load
    </script>
</body>
</html>
